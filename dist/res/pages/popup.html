<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>reflect.</title>
    <link rel="stylesheet" href="/res/theme.css" />
    <link rel="stylesheet" href="/res/pages/popup.css" />
    <script src="/src/popup.js" defer></script>
  </head>
  <body>
    <header class="head">
      <h1 class="wordmark">reflect.</h1>
      <label class="switch">
        <input type="checkbox" role="switch" id="enabled" />
        <span class="switch-track" aria-hidden="true"></span>
        <span id="enabledLabel">on.</span>
      </label>
    </header>

    <section class="site" aria-live="polite">
      <p class="site-name" id="siteName"></p>
      <p class="site-state" id="siteState"></p>
      <div class="actions">
        <button class="button primary" id="blockSite" hidden></button>
        <button class="link-button" id="blockPage" hidden>block just this page.</button>
      </div>
    </section>

    <footer class="foot">
      <a href="options.html" target="_blank">options.</a>
      <p id="shortcut"></p>
    </footer>
  </body>
</html>
